limit_req_zone $binary_remote_addr zone=john_presentation_auth:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name present-john.37.187.136.100.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name present-john.37.187.136.100.sslip.io;

    ssl_certificate /etc/letsencrypt/live/present-john.37.187.136.100.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/present-john.37.187.136.100.sslip.io/privkey.pem;

    client_max_body_size 4k;

    location = /api/auth/totp {
        limit_req zone=john_presentation_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
